---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-cluster-config
  namespace: webdev
data:
  redis.conf: |
    port 6379
    cluster-enabled yes
    cluster-config-file /data/nodes.conf
    cluster-node-timeout 5000
    appendonly yes
    maxmemory 512mb
    maxmemory-policy allkeys-lru
    save 900 1
    save 300 10

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-cluster
  namespace: webdev
spec:
  serviceName: redis-cluster-headless
  replicas: 6
  selector:
    matchLabels:
      app: redis-cluster
  template:
    metadata:
      labels:
        app: redis-cluster
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "/etc/redis/redis.conf"]
          ports:
            - containerPort: 6379
              name: client
            - containerPort: 16379
              name: gossip
          volumeMounts:
            - name: redis-config
              mountPath: /etc/redis
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: redis-config
          configMap:
            name: redis-cluster-config
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-storage
        resources:
          requests:
            storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: redis-cluster-headless
  namespace: webdev
spec:
  selector:
    app: redis-cluster
  ports:
    - port: 6379
      targetPort: 6379
      name: client
    - port: 16379
      targetPort: 16379
      name: gossip
  clusterIP: None

---
apiVersion: v1
kind: Service
metadata:
  name: redis-cluster-service
  namespace: webdev
spec:
  selector:
    app: redis-cluster
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP

---
# Job to initialize the Redis cluster after pods are ready
apiVersion: batch/v1
kind: Job
metadata:
  name: redis-cluster-init
  namespace: webdev
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: redis-cluster-init
          image: redis:7-alpine
          command:
            - /bin/sh
            - -c
            - |
              sleep 20
              redis-cli --cluster create \
                redis-cluster-0.redis-cluster-headless.webdev.svc.cluster.local:6379 \
                redis-cluster-1.redis-cluster-headless.webdev.svc.cluster.local:6379 \
                redis-cluster-2.redis-cluster-headless.webdev.svc.cluster.local:6379 \
                redis-cluster-3.redis-cluster-headless.webdev.svc.cluster.local:6379 \
                redis-cluster-4.redis-cluster-headless.webdev.svc.cluster.local:6379 \
                redis-cluster-5.redis-cluster-headless.webdev.svc.cluster.local:6379 \
                --cluster-replicas 1 --cluster-yes
