---
# ─── Zookeeper ───
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: webdev
spec:
  serviceName: zookeeper-headless
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.5.0
          ports:
            - containerPort: 2181
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
          volumeMounts:
            - name: zookeeper-data
              mountPath: /var/lib/zookeeper/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
  volumeClaimTemplates:
    - metadata:
        name: zookeeper-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-storage
        resources:
          requests:
            storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-headless
  namespace: webdev
spec:
  selector:
    app: zookeeper
  ports:
    - port: 2181
  clusterIP: None

---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-service
  namespace: webdev
spec:
  selector:
    app: zookeeper
  ports:
    - port: 2181
  type: ClusterIP

---
# ─── Kafka Cluster ───
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: webdev
spec:
  serviceName: kafka-headless
  replicas: 3
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper-service:2181"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://$(POD_NAME).kafka-headless.webdev.svc.cluster.local:9092"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "2"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_NUM_PARTITIONS
              value: "6"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "168"
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-storage
        resources:
          requests:
            storage: 20Gi

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: webdev
spec:
  selector:
    app: kafka
  ports:
    - port: 9092
  clusterIP: None

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: webdev
spec:
  selector:
    app: kafka
  ports:
    - port: 9092
  type: ClusterIP

---
# Kafka topic initialization job
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-init
  namespace: webdev
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-init
          image: confluentinc/cp-kafka:7.5.0
          command:
            - /bin/bash
            - -c
            - |
              sleep 30
              BROKER="kafka-0.kafka-headless.webdev.svc.cluster.local:9092"
              for topic in audit-log contact-notifications user-events project-events audit-log-dlq; do
                kafka-topics.sh --create --bootstrap-server $BROKER \
                  --topic $topic --partitions 6 --replication-factor 3 --if-not-exists
              done
              kafka-topics.sh --list --bootstrap-server $BROKER
