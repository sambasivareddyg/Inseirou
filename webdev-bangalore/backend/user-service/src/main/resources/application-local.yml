# application-local.yml
# Active when: -Dspring.profiles.active=local
# Overrides cluster addresses with localhost for native Windows dev (no Docker)

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/webdev_users?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: webdev
    password: webdev123
  data:
    redis:
      mode: standalone          # single Redis node — no cluster needed locally
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    prefer-ip-address: true

logging:
  level:
    com.webdev: DEBUG
