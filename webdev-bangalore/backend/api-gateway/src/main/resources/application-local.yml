spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
        - id: project-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/projects/**
          filters:
            - StripPrefix=1
        - id: contact-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/contact/**
          filters:
            - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.webdev: DEBUG
